name: Temporary osx-x64 Native AOT link check
on:
  push:
    branches: [fix/v017-osx-x64-link]
    paths: [.github/workflows/osx-x64-link-check.yml]
permissions:
  contents: read
jobs:
  osx-x64:
    if: contains(github.event.head_commit.message, '[macos-link-check]')
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-rc.1.26425.128
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
      - name: Native AOT bundle and published smoke
        run: scripts/release-build.sh 0.1.7-rc1 "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with:
          name: atf-osx-x64-link-check
          path: ${{ runner.temp }}/release/*
